name: GitHub release
on:
  push:
    tags: ['json-compare-*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        run: |
          v="${GITHUB_REF_NAME#json-compare-}"
          awk -v v="$v" '
            $0 ~ "^## "v" " {f=1; next}
            /^## / {f=0}
            f' Changelog.md \
          | sed -E 's/^- #### (.*)/\n### \1\n/; s/^ +- /- /' > notes.md
          [ -s notes.md ] || { echo "No changelog entry for $v"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
